version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: druid-postgres
    environment:
      POSTGRES_DB: druid
      POSTGRES_USER: druid
      POSTGRES_PASSWORD: druid_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U druid -d druid"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: zookeeper:3.9
    container_name: druid-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_PORT: 2181
    volumes:
      - zk_data:/data
      - zk_datalog:/datalog
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: druid-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: druid-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-create-buckets:
    image: minio/mc:RELEASE.2024-01-28T22-41-14Z
    container_name: druid-minio-provisioner
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/druid-segments || true;
      mc mb myminio/druid-logs || true;
      mc policy set public myminio/druid-segments || true;
      mc policy set public myminio/druid-logs || true;
      echo 'MinIO buckets successfully provisioned!';
      "

  # Base Configuration for Druid Services
  druid-base:
    image: apache/druid:31.0.0
    abstract: true # Docker Compose 3.8 supports abstract, but to prevent parse issues across older versions, we can define direct configs or standard environments.
    environment: &druid-env
      # Service Discovery
      druid_zk_service_host: zookeeper:2181

      # Metadata Store
      druid_metadata_storage_type: postgresql
      druid_metadata_storage_connector_connectURI: jdbc:postgresql://postgres:5432/druid
      druid_metadata_storage_connector_user: druid
      druid_metadata_storage_connector_password: druid_password

      # Deep Storage (S3 / MinIO)
      druid_storage_type: s3
      druid_s3_accessKey: minioadmin
      druid_s3_secretKey: minioadmin
      druid_s3_protocol: http
      druid_s3_enablePathStyleAccess: "true"
      druid_s3_endpoint_url: http://minio:9000
      druid_storage_bucket: druid-segments

      # Task Log Storage
      druid_indexer_logs_type: s3
      druid_indexer_logs_s3Bucket: druid-logs
      druid_indexer_logs_s3Prefix: druid/indexing-logs

      # Standard JVM Tuning Properties (General Overrides)
      LOG_LEVEL: info
      druid_emitter: noop
      druid_selectors_indexing_serviceName: druid/overlord
      druid_processing_numThreads: 1
      druid_processing_buffer_sizeBytes: 10485760 # 10MB
      druid_query_groupBy_maxResults: 10000

  coordinator:
    image: apache/druid:31.0.0
    container_name: druid-coordinator
    ports:
      - "8081:8081"
    environment:
      <<: *druid-env
      druid_service: druid/coordinator
      # Coordinator Heap Memory Override
      JAVA_OPTS: "-server -Xms256m -Xmx256m -XX:+UseG1GC"
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
      minio-create-buckets:
        condition: service_completed_successfully

  overlord:
    image: apache/druid:31.0.0
    container_name: druid-overlord
    ports:
      - "8090:8090"
    environment:
      <<: *druid-env
      druid_service: druid/overlord
      # Overlord Heap Memory Override
      JAVA_OPTS: "-server -Xms256m -Xmx256m -XX:+UseG1GC"
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_healthy
      minio-create-buckets:
        condition: service_completed_successfully

  broker:
    image: apache/druid:31.0.0
    container_name: druid-broker
    ports:
      - "8082:8082"
    environment:
      <<: *druid-env
      druid_service: druid/broker
      # Broker Memory Tuning
      JAVA_OPTS: "-server -Xms512m -Xmx512m -XX:+UseG1GC"
      druid_processing_buffer_sizeBytes: 16777216 # 16MB for Broker processing
      druid_processing_numThreads: 1
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_healthy

  historical:
    image: apache/druid:31.0.0
    container_name: druid-historical
    ports:
      - "8083:8083"
    environment:
      <<: *druid-env
      druid_service: druid/historical
      # Historical Memory Tuning
      JAVA_OPTS: "-server -Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m -XX:+UseG1GC"
      druid_processing_buffer_sizeBytes: 16777216 # 16MB for Historical processing
      druid_processing_numThreads: 1
      druid_segmentCache_locations: '[{"path":"/opt/druid/var/druid/segment-cache","maxSize":10737418240}]' # 10GB Cache
      druid_server_maxSize: 10737418240 # 10GB Server Segment Cap
    volumes:
      - historical_cache:/opt/druid/var/druid/segment-cache
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_healthy

  middlemanager:
    image: apache/druid:31.0.0
    container_name: druid-middlemanager
    ports:
      - "8091:8091"
      - "8100-8110:8100-8110" # Open port range for Peon tasks
    environment:
      <<: *druid-env
      druid_service: druid/middleManager
      # MiddleManager Memory Tuning
      JAVA_OPTS: "-server -Xms128m -Xmx128m -XX:+UseG1GC"
      druid_worker_capacity: 3 # Maximum peons to spawn
      # Peon specific configurations (Tuning spawned tasks)
      druid_indexer_runner_javaOpts: "-server -Xms256m -Xmx256m -XX:MaxDirectMemorySize=256m -XX:+UseG1GC"
      druid_indexer_fork_property_druid_processing_numThreads: 1
      druid_indexer_fork_property_druid_processing_buffer_sizeBytes: 10485760 # Peon Buffer Size 10MB
    volumes:
      - middlemanager_var:/opt/druid/var
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_healthy

  router:
    image: apache/druid:31.0.0
    container_name: druid-router
    ports:
      - "8888:8888"
    environment:
      <<: *druid-env
      druid_service: druid/router
      # Router Heap Memory Override
      JAVA_OPTS: "-server -Xms128m -Xmx128m -XX:+UseG1GC"
    depends_on:
      postgres:
        condition: service_healthy
      zookeeper:
        condition: service_healthy

volumes:
  postgres_data:
  zk_data:
  zk_datalog:
  minio_data:
  historical_cache:
  middlemanager_var:
